services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: auditsphere
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: auditsphere
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditsphere"]
      interval: 5s
      retries: 20
  redis:
    image: redis:8.10
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["queues:/data"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
  rustfs:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: auditsphere
      RUSTFS_SECRET_KEY: localdev-storage
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["objects:/data"]
volumes:
  postgres:
  objects:
  queues:
