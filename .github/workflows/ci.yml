name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 12.8.1
          runtime: node@24.21.0
          install: false
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: Verify CI permission and cache policy
        run: node scripts/verify-ci-workflow.mjs
      - name: Verify dependency install denial paths
        run: pnpm exec node scripts/verify-pnpm-install-policy.mjs
      - run: pnpm setup:local
      - run: pnpm infra:up
      - run: pnpm db:migrate
      - run: pnpm db:roles
      - run: pnpm build:server
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start compiled local services
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          node apps/worker/dist/main.js > worker.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: pnpm verify:all
        env:
          RUN_LIVE_E2E: "1"
      - run: pnpm contracts:check
      - run: pnpm audit --audit-level=moderate
      - run: pnpm build:linux
      - run: pnpm smoke:linux
      - name: Package verified build
        run: |
          mkdir -p release
          tar -czf release/web.tar.gz -C dist/web/browser .
          docker save auditsphere-local:compatibility | gzip > release/compatibility-image.tar.gz
          sha256sum release/* > release/SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: verified-build-${{ github.sha }}
          path: release/
          retention-days: 7
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-${{ github.sha }}
          path: |
            api.log
            worker.log
            test-results/
          retention-days: 7
      - name: Stop local infrastructure
        if: always()
        run: docker compose down

  publish-web-assets:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: verified-build-${{ github.sha }}
          path: release
      - name: Publish public web assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum web.tar.gz > web-SHA256SUMS
          gh release create "build-${GITHUB_SHA}" web.tar.gz web-SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Verified web build ${GITHUB_SHA:0:7}" --notes "CI-verified static web assets. API and Microsoft 365 configuration are required for connected workflows. This development build does not represent complete product acceptance. No deployment is performed."
