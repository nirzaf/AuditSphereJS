name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: pnpm infra:up
      - run: pnpm db:migrate
      - run: pnpm db:roles
      - run: pnpm db:seed
      - run: pnpm build:server
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start compiled local services
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          node apps/worker/dist/main.js > worker.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: pnpm verify:all
        env:
          RUN_LIVE_E2E: '1'
      - run: pnpm contracts:check
      - run: pnpm audit --audit-level=moderate
      - run: pnpm build:linux
      - run: pnpm smoke:linux
      - name: Package verified build
        run: |
          mkdir -p release
          tar -czf release/web.tar.gz -C dist/web .
          docker save auditsphere-local:compatibility | gzip > release/compatibility-image.tar.gz
          sha256sum release/* > release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: verified-build-${{ github.sha }}
          path: release/
          retention-days: 7
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.sha }}
          path: |
            api.log
            worker.log
            test-results/
          retention-days: 7
      - name: Stop local infrastructure
        if: always()
        run: docker compose down
